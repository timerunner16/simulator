name: Build and Deploy Github Pages
permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Setup emsdk
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 6.0.3
        actions-cache-folder: 'emsdk-cache'

    - name: Install Ninja
      shell: sh
      run: |
        sudo apt-get install ninja-build

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: pages-${{ github.job }}

    - name: Build
      shell: sh
      run: |
        emcmake cmake -S '${{ github.workspace }}' -B '${{ github.workspace }}/build' -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build '${{ github.workspace }}/build' --parallel

    - name: Upload static files
      id: deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.workspace }}/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
